name: SkillSpector Security Scan

on:
  push:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install -q uv

      - name: Install SkillSpector
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install 'git+https://github.com/NVIDIA/skillspector.git'

      - name: Run static security scan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # 加大 OSV.dev 请求超时, 避免网络抖动被误报为 "SC4 fallback" 问题
          export SKILLSPECTOR_OSV_TIMEOUT=60
          BASELINE_ARGS=()
          if [ -f .skillspector-baseline.yaml ]; then BASELINE_ARGS=(--baseline .skillspector-baseline.yaml); fi
          skillspector scan . --no-llm "${BASELINE_ARGS[@]}" --format sarif    --output report.sarif || true
          skillspector scan . --no-llm "${BASELINE_ARGS[@]}" --format markdown --output report.md || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: |
            report.sarif
            report.md
          if-no-files-found: warn
